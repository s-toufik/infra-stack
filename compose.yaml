name: dev-infra

services:

  # ============================================================================
  # PostgreSQL
  # ============================================================================

  postgres:
    image: postgres:18
    container_name: dev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - dev


  # ============================================================================
  # MongoDB
  # ============================================================================

  mongodb:
    image: mongo:7.0
    container_name: dev-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "${MONGO_USERNAME:-admin}",
          "--password",
          "${MONGO_PASSWORD:-admin}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - dev


  # ============================================================================
  # Loki
  # ============================================================================

  loki:
    image: grafana/loki:3.5.0
    container_name: dev-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/loki.yaml"

    ports:
      - "${LOKI_PORT:-3100}:3100"

    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - dev


  # ============================================================================
  # OpenTelemetry Collector
  # ============================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: dev-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/otel-collector.yaml"

    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8888}:8888"

    volumes:
      - ./config/otel/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro

    depends_on:
      loki:
        condition: service_healthy

    networks:
      - dev


  # ============================================================================
  # Grafana
  # ============================================================================

  grafana:
    image: grafana/grafana:12.1.0
    container_name: dev-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      loki:
        condition: service_healthy

    networks:
      - dev


# ==============================================================================
# Volumes
# ==============================================================================

volumes:

  postgres_data:
    name: dev_postgres_data

  mongodb_data:
    name: dev_mongodb_data

  loki_data:
    name: dev_loki_data

  grafana_data:
    name: dev_grafana_data


# ==============================================================================
# Network
# ==============================================================================

networks:

  dev:
    name: dev_network
    driver: bridge
