services:

  # ============================================================================
  # Loki
  # ============================================================================

  loki:
    image: grafana/loki:3.5.0
    container_name: dev-loki

    command:
      - "-config.file=/etc/loki/loki.yaml"

    ports:
      - "${LOKI_PORT:-3100}:3100"

    volumes:
      - ../config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - dev
